# Render blueprint for the NudgeyCart API. The WooCommerce demo store itself runs in the visitor's
# browser (WordPress Playground); this service holds the secrets and talks to Claude and PayPal.
services:
  - type: web
    name: nudgeycart-api
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn nudgeycart.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: nudgeycart-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: NUDGEY_DATA_DIR
        value: /var/data
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SANDBOX_BUYER_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
