<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NudgeyCart Merchant</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-grid.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-theme-quartz.css">
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/dist/ag-grid-community.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #14181d; --muted: #667085; --line: #e4e7ec;
    --accent: #0057b8; --accent-soft: #e8f1fd; --good: #067647; --good-soft: #e3f6ec;
    --warn: #b54708; --warn-soft: #fef0e1; --bad: #b42318; --bad-soft: #fde8e7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --panel: #171a20; --ink: #e8eaed; --muted: #98a2b3; --line: #2a2f37;
      --accent: #6ea8fe; --accent-soft: #16263d; --good: #5fd39a; --good-soft: #10291d;
      --warn: #f7b267; --warn-soft: #2e2113; --bad: #f97066; --bad-soft: #321615;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 16px 24px; border-bottom: 1px solid var(--line);
           background: var(--panel); position: sticky; top: 0; z-index: 5; }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff;
          display: grid; place-items: center; font-weight: 800; }
  h1 { font-size: 16px; margin: 0; }
  .sub { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  button.primary { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 9px 14px;
                   font: 600 13px inherit; cursor: pointer; }
  button.primary:disabled { opacity: .5; cursor: default; }
  main { padding: 20px 24px 40px; max-width: 1400px; margin: 0 auto; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .kpi .label { color: var(--muted); font-size: 12px; }
  .kpi .value { font-size: 24px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  @media (max-width: 900px) { .row { grid-template-columns: 1fr; } main { padding: 16px; } header { padding: 12px 16px; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .panel h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .bars .bar { display: grid; grid-template-columns: 120px 1fr 60px; gap: 10px; align-items: center; margin: 8px 0; }
  .track { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); border-radius: 99px; }
  .fill.ctl { background: var(--muted); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .grid-wrap { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  #grid { height: 460px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; line-height: 20px; }
  .b-paid { background: var(--good-soft); color: var(--good); }
  .b-offered, .b-accepted { background: var(--accent-soft); color: var(--accent); }
  .b-control { background: var(--line); color: var(--muted); }
  .b-dismissed, .b-opened { background: var(--warn-soft); color: var(--warn); }
  .b-refunded { background: var(--bad-soft); color: var(--bad); }
  .drawer { position: fixed; top: 0; right: 0; width: min(440px, 100%); height: 100%; background: var(--panel);
            border-left: 1px solid var(--line); box-shadow: -10px 0 30px rgba(0,0,0,.12); transform: translateX(100%);
            transition: transform .2s ease; z-index: 10; padding: 18px; overflow: auto; }
  .drawer.open { transform: none; }
  .msg { padding: 8px 11px; border-radius: 12px; margin: 6px 0; max-width: 90%; background: var(--bg); }
  .msg.shopper { margin-left: auto; background: var(--accent-soft); }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 10px; font-size: 13px; margin: 12px 0; }
  .kv div:nth-child(odd) { color: var(--muted); }
  .close { float: right; background: none; border: 0; font-size: 22px; color: var(--muted); cursor: pointer; }
  .notice { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--ink); display: none; }
  .notice a { color: var(--accent); }
  .empty { color: var(--muted); padding: 20px; text-align: center; }
  .ag-theme-quartz, .ag-theme-quartz-dark { --ag-font-family: inherit; --ag-font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="logo">N</div>
  <div><h1 id="mname">NudgeyCart</h1><div class="sub" id="msub">Merchant dashboard</div></div>
  <div class="spacer"></div>
  <button class="primary" id="invoiceBtn" disabled>Invoice fees via PayPal</button>
</header>
<main>
  <div class="kpis">
    <div class="kpi"><div class="label">Saved revenue</div><div class="value" id="k-rev">–</div><div class="hint" id="k-orders"></div></div>
    <div class="kpi"><div class="label">Conversion uplift vs control</div><div class="value" id="k-uplift">–</div><div class="hint" id="k-uplift-h"></div></div>
    <div class="kpi"><div class="label">Given away to close</div><div class="value" id="k-disc">–</div><div class="hint">only within your margin floor</div></div>
    <div class="kpi"><div class="label">NudgeyCart fees</div><div class="value" id="k-fees">–</div><div class="hint" id="k-fees-h"></div></div>
  </div>
  <div class="notice" id="notice"></div>
  <div class="row">
    <div class="panel"><h2>Treatment vs control (holdout)</h2><div class="bars" id="ab"></div></div>
    <div class="panel"><h2>What closed the sale</h2><div class="bars" id="levers"></div></div>
  </div>
  <div class="grid-wrap"><div id="grid"></div></div>
</main>
<aside class="drawer" id="drawer"></aside>
<script>
(function () {
  var token = location.hash.slice(1);
  var dark = matchMedia("(prefers-color-scheme: dark)").matches;
  var cur = "USD";
  function fmt(v) {
    if (v == null) return "–";
    return new Intl.NumberFormat("en-US", { style: "currency", currency: cur }).format(v);
  }
  function api(path, method) {
    return fetch(path, { method: method || "GET", headers: { "X-Admin-Token": token } })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error); return j; }); });
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var LEVER = { pay_later: "Pay Later", express_checkout: "Express checkout", free_shipping: "Free shipping",
                discount: "Discount", reassurance: "Reassurance", none: "No offer" };

  var gridEl = document.getElementById("grid");
  gridEl.className = dark ? "ag-theme-quartz-dark" : "ag-theme-quartz";
  var gridApi = agGrid.createGrid(gridEl, {
    rowData: [],
    defaultColDef: { sortable: true, filter: true, resizable: true },
    pagination: true, paginationPageSize: 20,
    getRowId: function (p) { return p.data.id; },
    onRowClicked: function (e) { openDrawer(e.data); },
    columnDefs: [
      { headerName: "When", field: "created_at", width: 150, sort: "desc",
        valueFormatter: function (p) { return new Date(p.value * 1000).toLocaleString(); } },
      { headerName: "Group", field: "group_name", width: 110 },
      { headerName: "State", field: "state", width: 110,
        cellRenderer: function (p) { return '<span class="badge b-' + p.value + '">' + p.value + "</span>"; } },
      { headerName: "Trigger", field: "trigger", width: 110 },
      { headerName: "Why leaving", field: "reason_category", width: 150 },
      { headerName: "Lever", field: "lever", width: 140, valueFormatter: function (p) { return LEVER[p.value] || ""; } },
      { headerName: "Cart", field: "cart_total", width: 100, type: "rightAligned", valueFormatter: function (p) { return fmt(p.value); } },
      { headerName: "Discount", field: "discount_amount", width: 105, type: "rightAligned",
        valueFormatter: function (p) { return p.value ? fmt(p.value) : ""; } },
      { headerName: "Paid", field: "paid_total", width: 100, type: "rightAligned", valueFormatter: function (p) { return p.value ? fmt(p.value) : ""; } },
      { headerName: "Fee", field: "fee_amount", width: 90, type: "rightAligned", valueFormatter: function (p) { return p.value ? fmt(p.value) : ""; } },
      { headerName: "Order", field: "store_order_id", width: 90 },
      { headerName: "Agent reasoning", field: "rationale", flex: 1, minWidth: 260, tooltipField: "rationale" },
      { headerName: "Model", field: "model", width: 140 },
      { headerName: "ms", field: "decision_ms", width: 80, type: "rightAligned" }
    ]
  });

  function bars(el, rows) {
    var max = Math.max.apply(null, rows.map(function (r) { return r.value; }).concat([0.0001]));
    el.innerHTML = rows.length ? rows.map(function (r) {
      return '<div class="bar"><div>' + esc(r.label) + '</div><div class="track"><div class="fill ' + (r.cls || "") +
        '" style="width:' + (100 * r.value / max).toFixed(1) + '%"></div></div><div class="num">' + esc(r.text) + "</div></div>";
    }).join("") : '<div class="empty">No data yet</div>';
  }

  function render(s) {
    cur = s.merchant.currency;
    document.getElementById("mname").textContent = s.merchant.name;
    document.getElementById("msub").textContent = "Fee " + (s.merchant.fee_pct * 100) + "% on saved sales · margin floor " +
      (s.merchant.min_margin_pct * 100) + "% · holdout " + s.merchant.control_pct + "%" + (s.merchant.test_mode ? " · TEST MODE" : "");
    document.getElementById("k-rev").textContent = fmt(s.saved_revenue);
    document.getElementById("k-orders").textContent = s.saved_orders + " orders closed by the agent";
    document.getElementById("k-uplift").textContent = s.uplift_pts == null ? "–" : (s.uplift_pts > 0 ? "+" : "") + s.uplift_pts + " pts";
    document.getElementById("k-uplift-h").textContent = "nudged " + pct(s.treatment.rate) + " vs holdout " + pct(s.control.rate);
    document.getElementById("k-disc").textContent = fmt(s.discount_given);
    document.getElementById("k-fees").textContent = fmt(s.fees_total);
    document.getElementById("k-fees-h").textContent = fmt(s.fees_uninvoiced) + " not invoiced yet";
    document.getElementById("invoiceBtn").disabled = !(s.fees_uninvoiced > 0);
    bars(document.getElementById("ab"), [
      { label: "Nudged", value: s.treatment.rate || 0, text: pct(s.treatment.rate) + " (" + s.treatment.converted + "/" + s.treatment.visitors + ")" },
      { label: "Holdout", value: s.control.rate || 0, text: pct(s.control.rate) + " (" + s.control.converted + "/" + s.control.visitors + ")", cls: "ctl" }
    ]);
    bars(document.getElementById("levers"), Object.keys(s.levers).map(function (k) {
      var l = s.levers[k];
      return { label: LEVER[k] || k, value: l.revenue, text: l.paid + "/" + l.offered };
    }).sort(function (a, b) { return b.value - a.value; }));
    gridApi.setGridOption("rowData", s.nudges);
  }
  function pct(r) { return r == null ? "–" : (r * 100).toFixed(1) + "%"; }

  function openDrawer(n) {
    var d = document.getElementById("drawer");
    d.innerHTML = '<button class="close" aria-label="Close">×</button><h3 style="margin:0 0 4px">Conversation</h3>' +
      '<div class="sub">' + esc(n.id) + " · visitor " + esc(n.visitor_id) + "</div>" +
      (n.transcript || []).map(function (t) {
        return '<div class="msg ' + (t.role === "shopper" ? "shopper" : "") + '">' + esc(t.text) +
          (t.final_total ? '<div class="sub">offer: ' + esc(LEVER[t.lever] || t.lever) + " · total " + fmt(Number(t.final_total)) + "</div>" : "") + "</div>";
      }).join("") +
      '<div class="kv"><div>State</div><div>' + esc(n.state) + "</div><div>Why leaving</div><div>" + esc(n.reason_category) +
      "</div><div>Lever</div><div>" + esc(LEVER[n.lever] || "") + "</div><div>Agent reasoning</div><div>" + esc(n.rationale) +
      "</div><div>Model</div><div>" + esc(n.model) + " · " + esc(n.decision_ms) + " ms</div>" +
      (n.error ? '<div>Issue</div><div style="color:var(--bad)">' + esc(n.error) + "</div>" : "") + "</div>";
    d.classList.add("open");
    d.querySelector(".close").onclick = function () { d.classList.remove("open"); };
  }

  document.getElementById("invoiceBtn").onclick = function () {
    var b = this; b.disabled = true; b.textContent = "Creating PayPal invoice…";
    api("/v1/merchant/invoices", "POST").then(function (inv) {
      var n = document.getElementById("notice");
      n.style.display = "block";
      n.innerHTML = "PayPal invoice " + esc(inv.paypal_invoice_id) + " sent for " + fmt(Number(inv.amount)) + " (" +
        inv.orders + " saved orders). " + (inv.url ? '<a target="_blank" rel="noopener" href="' + esc(inv.url) + '">Open invoice</a>' : "");
      load();
    }).catch(function (e) {
      var n = document.getElementById("notice"); n.style.display = "block"; n.textContent = "Invoice failed: " + e.message;
    })
      .finally(function () { b.textContent = "Invoice fees via PayPal"; });
  };

  function load() {
    if (!token) { document.getElementById("notice").style.display = "block";
      document.getElementById("notice").textContent = "Add your admin token after # in the URL."; return; }
    api("/v1/merchant/summary").then(render).catch(function (e) {
      var n = document.getElementById("notice"); n.style.display = "block"; n.textContent = e.message;
    });
  }
  load();
  setInterval(load, 5000);
})();
</script>
</body>
</html>
